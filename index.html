<style>
:root{--bg:#0b1220;--card:#162033;--line:#2a3a56;--txt:#e6edf7;--mut:#8ea0bd;--acc:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#hud{position:absolute;z-index:5;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.chip{background:#0b1220d0;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px}
.maplibregl-ctrl-top-left{margin-top:52px}
#panel{position:absolute;z-index:6;background:#0b1220f5;border-top:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:820px){#panel{top:0;right:0;bottom:0;width:390px;border-left:1px solid var(--line);border-top:0}#hud{right:396px}}
@media(max-width:819px){#panel{left:0;right:0;bottom:0;height:58vh}#life{height:96px;object-fit:cover}}
#panel.min #body,#panel.min #life,#panel.min #ctx{display:none}
#panel.min{height:auto!important}
#meters{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;padding:6px 8px}
.mt{font-size:11px;color:var(--mut)}
.bar{height:7px;background:#1f2c44;border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%}
#life{width:100%;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#ctx{padding:5px 8px;font-size:12px;color:var(--mut)}
#tabs{display:flex;gap:4px;padding:4px 6px;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:12px}
#tabs button.on{background:var(--acc);color:#04202e;font-weight:700}
#body{flex:1;overflow:auto;padding:8px}
h4{margin:10px 0 4px;color:var(--acc);font-size:13px}
.btn{background:var(--acc);color:#04202e;border:0;border-radius:8px;padding:9px 12px;font-weight:700;width:100%;margin-top:8px;font-size:14px}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center}
.act{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;margin:4px 0}
.act.off{opacity:.45}
.act b{display:block}.act small{color:var(--mut)}
.act .ic{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mode{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 2px;text-align:center;font-size:12px}
.mode.on{border-color:var(--acc);background:#10324a}
select{width:100%;padding:8px;border-radius:8px;background:var(--card);color:var(--txt);border:1px solid var(--line);margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin:5px 0}
.mut{color:var(--mut)}
#modal{position:absolute;inset:0;z-index:20;background:#000a;display:none;align-items:center;justify-content:center;padding:12px}
#card{background:#0e1729;border:1px solid var(--acc);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.unl{color:var(--warn);letter-spacing:3px;font-size:12px;font-weight:700}
#card h2{margin:4px 0 0;font-size:26px}
.reg{color:var(--mut);letter-spacing:2px;font-size:12px}
#card a,#body a{color:var(--acc)}
#toast{position:absolute;z-index:30;left:50%;transform:translateX(-50%);top:46px;background:#0b1220f0;border:1px solid var(--acc);border-radius:12px;padding:8px 14px;max-width:min(92vw,520px);display:none;font-size:13px}
</style>

   pts.push([Math.atan2(z,Math.hypot(x,y))*180/Math.PI,Math.atan2(y,x)*180/Math.PI]);}

function cumul(p){const c=[0];for(let i=1;i<p.length;i++)c.push(c[i-1]+hav({lat:p[i-1][0],lng:p[i-1][1]},{lat:p[i][0],lng:p[i][1]}));return c;}

  const seg=(c[hi]-c[lo])||1e-9,t=clamp((km-c[lo])/seg,0,1),a=J.path[lo],b=J.path[hi];return{lat:a[0]+(b[0]-a[0])*t,lng:a[1]+(b[1]-a[1])*t};}

function season(){const m=localD().getUTCMonth();return [11,0,1].includes(m)?'winter':m<5?'spring':m<8?'summer':'autumn';}
function dayLen(){const d=localD(),doy=(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5;return clamp(12+6*Math.sin(2*Math.PI*(doy-80)/365)*clamp((Math.abs(S.pos.lat)-20)/40,0,1.3),2,22);}
function daylight(h,dl){const sr=12-dl/2,ss=12+dl/2;return clamp(.5+Math.min(h-sr,ss-h)/1.5,0,1);}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function clockStr(){const d=localD(),p=n=>String(n).padStart(2,'0');return {winter:'❄️',spring:'🌱',summer:'☀️',autumn:'🍂'}[season()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]+' · '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
function synthWeather(){const m=localD().getUTCMonth(),base=[-10,-8,-2,6,14,19,22,19,13,5,-3,-8][m];WX.temp=Math.round(base-(S.pos.lat-55)*.6-Math.max(0,S.pos.lng-60)*.08);}
function kindOf(c){if(c>=95)return'storm';if(c>=71&&c<=77||c===85||c===86)return'snow';if(c>=51&&c<=67||c>=80&&c<=82)return'rain';if(c===45||c===48)return'fog';return'clear';}
async function refreshWeather(){

  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lng.toFixed(3)}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m&timezone=auto`);
    const j=(await r.json()).current;WX.temp=Math.round(j.temperature_2m);WX.kind=kindOf(j.weather_code);WX.cloud=j.cloud_cover;WX.wind=j.wind_speed_10m;WX.live=true;
  }catch(e){synthWeather();WX.live=false;}
  try{const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat.toFixed(3)}&longitude=${lng.toFixed(3)}`);WX.elev=Math.round((await r.json()).elevation[0]);}catch(e){}
  dirty=true;
}

/* ============ context detection (OSM tags -> actions) ============ */
function detectContext(){
  const set=new Set(),names=[],zoom=map.getZoom();
  if(hav(S.pos,S.home)<.35)set.add('home');
  let low=zoom<13.5;
  if(!low){
    const p=map.project([S.pos.lng,S.pos.lat]),cv=map.getCanvas();
    if(p.x>=0&&p.y>=0&&p.x<=cv.clientWidth&&p.y<=cv.clientHeight){
      const r=zoom>=15?36:24;let fs=[];
      try{fs=map.queryRenderedFeatures([[p.x-r,p.y-r],[p.x+r,p.y+r]]);}catch(e){}
      for(const f of fs){
        const sl=f.sourceLayer,pr=f.properties||{},cl=String(pr.class||''),sc=String(pr.subclass||'');
        if(sl==='water')set.add('water');
        else if(sl==='waterway'){if(cl==='river'||cl==='canal')set.add('water');}
        else if(sl==='landcover'){const m={wood:'forest',grass:'meadow',sand:'beach',wetland:'wetland',farmland:'field',ice:'snowfield',rock:'mountain'}[cl];if(m)set.add(m);}
        else if(sl==='landuse'){if(['residential','commercial','retail','industrial'].includes(cl))set.add('town');if(['park','garden','playground','pitch'].includes(cl))set.add('park');}
        else if(sl==='park'){set.add('park');if(['national_park','nature_reserve','protected_area'].includes(cl))set.add('reserve');}
        else if(sl==='building')set.add('town');
        else if(sl==='mountain_peak')set.add('mountain');
        else if(sl==='transportation'){if(['path','track','pedestrian'].includes(cl))set.add('trail');else if(cl==='rail')set.add('rail');else set.add('road');}
        else if(sl==='poi'){
          const k=cl+' '+sc,nm=pr['name:latin']||pr.name;if(nm&&names.length<3&&!names.includes(nm))names.push(nm);
          if(/lodging|hotel|hostel|motel|guest/.test(k))set.add('hotel');
          else if(/shop|grocery|supermarket|clothing|store|mall|convenience|bakery|butcher/.test(k))set.add('shop');
          else if(/restaurant|cafe|fast_food|bar|pub|food_court/.test(k))set.add('eatery');
          else if(/museum|gallery/.test(k))set.add('museum');
          else if(/railway|station|bus/.test(k))set.add('station');
          else if(/harbor|ferry|port|marina/.test(k))set.add('port');
          else if(/toilet/.test(k))set.add('toilets');
          else if(/park|garden|playground/.test(k))set.add('park');
          else if(/attraction|monument|castle|memorial|viewpoint|place_of_worship|zoo/.test(k))set.add('sight');
        }
      }
      if(set.size===0)set.add('field');
    }else low=true;
  }
  const t={};set.forEach(k=>t[k]=1);
  const nice={home:'🏠 Home',water:'🌊 Waterside',forest:'🌲 Forest',meadow:'🌾 Meadow',beach:'🏖 Beach',wetland:'🌿 Wetland',field:'🌾 Open country',snowfield:'🏔 Ice/snow',mountain:'⛰ Mountain',town:'🏘 Settlement',park:'🌳 Park',reserve:'🦌 Nature reserve',trail:'🥾 Trail',road:'🛣 Road',rail:'🚆 Railway',hotel:'🏨 Hotel',shop:'🛒 Shop',eatery:'🍽 Café/restaurant',museum:'🏛 Museum',station:'🚉 Station',port:'⚓ Port',toilets:'🚻 Public toilets',sight:'📸 Sight'};
  CTX={tags:t,low,label:Object.keys(t).map(k=>nice[k]||k).join(' · '),names};
  dirty=true;
}

/* ============ needs ============ */
const clampM=()=>{for(const k in S.m)S.m[k]=clamp(S.m[k],0,100);if(S.pet)S.pet.care=clamp(S.pet.care,0,100);};
function decay(min,mode){
  const h=min/60,M=mode?MODES[mode]:null,k=M?M.mult:1,ex=M?M.ex:{e:0,x:0},o=OUT();
  const cold=WX.temp<-8&&!o.w,hot=WX.temp>28&&o.w,m=S.m;
  m.energy-=h*(3*k+ex.e)*(cold?1.6:1);m.hunger-=h*4*k*(1+ex.x*.3);m.thirst-=h*5*k*(1+ex.x*.4);
  m.hygiene-=h*1.2*k*(1+ex.x*.5);m.bladder-=h*4*k;
  let md=.8;if(m.hunger<20||m.thirst<20||m.energy<15||m.bladder<15)md+=3;if(cold||hot)md+=2.5;
  m.mood-=h*md*(M&&!M.manual?.5:1);
  if(S.pet)S.pet.care-=h*2.5;
  clampM();
}
function applyFx(fx){if(!fx)return'';let s=[];for(const k in fx){if(k==='pet'){if(S.pet)S.pet.care+=fx[k];}else S.m[k]+=fx[k];s.push((fx[k]>0?'+':'')+Math.round(fx[k])+IC[k]);}clampM();return s.join(' ');}
function autoCare(){
  const m=S.m;
  if(m.hunger<30){if(S.inv.food>0){S.inv.food--;m.hunger+=35;S.stats.meals++;}else if(S.money>=350){S.money-=350;m.hunger+=50;S.stats.meals++;toast('🍲 You bought a hot meal on the way (₽350).');}}
  if(m.thirst<30){if(S.inv.water>0){S.inv.water--;m.thirst+=40;}else if(S.money>=60){S.money-=60;m.thirst+=40;}}
  if(m.energy<25){if(J.mode==='train'||J.mode==='boat'){m.energy+=45;toast('😴 You napped in your berth.');}else if(J.mode==='drive'&&S.money>=200){S.money-=200;m.energy+=30;toast('☕ Break at a roadside café (₽200).');}}
  if(m.bladder<25)m.bladder=100;
  if(S.pet&&S.pet.care<30&&S.inv.petfood>0){S.inv.petfood--;S.pet.care+=35;}
  clampM();
}

/* ============ actions ============ */
function blocked(p){
  if(!p)return'';
  if(p.cost&&S.money<p.cost)return'Need ₽'+p.cost;
  if(p.items)for(const k in p.items)if((S.inv[k]||0)<p.items[k])return'Need '+k;
  if(p.need)for(const k in p.need)if(S.m[k]<p.need[k])return'Too low: '+k;
  return p.req?p.req():'';
}
function perform(p){
  if(act||J)return toast('Busy…');
  const w=blocked(p);if(w)return toast('⛔ '+w);
  if(p.cost)S.money-=p.cost;
  act={anim:p.anim,t0:performance.now(),dur:clamp(p.min*25,2200,4500),min:p.min,T0:S.time,p};dirty=true;
}
function finishAct(){
  const p=act.p;
  if(p.items)for(const k in p.items)S.inv[k]-=p.items[k];
  const s=applyFx(p.fx);if(p.stat)S.stats[p.stat]=(S.stats[p.stat]||0)+1;
  S.xp+=p.xp||5;
  act=null;
  if(p.after)p.after();
  if(s)toast((p.label||'Done')+': '+s);
  chk();dirty=true;save();
}
function collect(){
  if(Math.random()>.7)return;
  const r=Math.random(),tier=r<.7?0:r<.95?1:2,pool=COLLECT.filter(c=>c[1]===tier),it=rnd(pool);
  S.collect[it[0]]=(S.collect[it[0]]||0)+1;S.stats.collected++;S.xp+=[10,30,80][tier];
  toast('✨ Found: '+it[0]+' ('+['common','rare','epic'][tier]+')');
}
async function spotWildlife(){
  const{lat,lng}=S.pos,d=.3;
  try{
    const u=`https://api.gbif.org/v1/occurrence/search?decimalLatitude=${(lat-d).toFixed(3)},${(lat+d).toFixed(3)}&decimalLongitude=${(lng-d).toFixed(3)},${(lng+d).toFixed(3)}&kingdomKey=1&hasCoordinate=true&limit=40`;
    const j=await (await fetch(u)).json(),res=(j.results||[]).filter(r=>r.species);
    if(!res.length){toast('🔭 You scan the area but see nothing unusual right now.');return;}
    const r=rnd(res),nm=r.vernacularName||r.species;
    if(!S.species.find(x=>x.key===r.speciesKey)){S.species.push({name:nm,sci:r.species,key:r.speciesKey});S.xp+=40;toast('🦌 New species logged: '+nm+' ('+r.species+') — real GBIF record from this area.');}
    else toast('🔭 You spot a '+nm+' again.');
    chk();dirty=true;save();
  }catch(e){toast('🔭 Wildlife records unavailable offline.');}
}

function rumour(){
  const u=DISC.filter(d=>!S.discovered.includes(d.id)).map(d=>({d,km:Math.min(...d.pts.map(p=>hav(S.pos,{lat:p[0],lng:p[1]})))})).sort((a,b)=>a.km-b.km)[0];
  if(!u)return'You\'ve discovered every landmark in this atlas. 🏆';
  const b=dirName(bearing(S.pos,{lat:u.d.pts[0][0],lng:u.d.pts[0][1]}));
  return'🗺 Rumour: something remarkable lies in '+u.d.region+', about '+Math.round(u.km).toLocaleString()+' km '+b+' of here.';
}

/* ============ discoveries & missions ============ */
function checkDisc(){
  for(const D of DISC){
    if(S.discovered.includes(D.id))continue;
    if(D.pts.some(p=>hav(S.pos,{lat:p[0],lng:p[1]})<D.r)){S.discovered.push(D.id);S.xp+=100;S.m.mood=clamp(S.m.mood+10,0,100);chk();save();openDisc(D.id,true);return;}
  }
}
function openDisc(id,fresh){

   (D.unesco?' · <a target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/'+D.unesco+'">UNESCO</a>':'')+' · <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/#map=8/'+D.pts[0][0]+'/'+D.pts[0][1]+'">OpenStreetMap</a></div>';
  h+='<button class="btn" onclick="G.close()">'+(J?'Continue journey ▶':'Close')+'</button>';
  showModal(h);
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(D.wiki)).then(r=>r.json()).then(j=>{

async function osrm(a,b){
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),9000);
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=simplified&geometries=geojson`,{signal:ac.signal});clearTimeout(to);
    const j=await r.json();if(j.routes&&j.routes[0])return j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
  }catch(e){}
  return null;
}
function region(p){return p.lat>62?'north':p.lng>100?'east':'west';}
async function startJourney(){
  if(J||act||window._starting)return;
  if(!dest)return toast('📍 Tap the map or choose a destination first.');
  const mode=travelMode,M=MODES[mode],straight=hav(S.pos,dest);
  if(straight<.05)return toast('You are already here.');
  if(straight*M.cost>S.money*1.3&&M.cost*straight>S.money)return toast('⛔ Need about ₽'+Math.round(straight*M.cost).toLocaleString()+' — work a shift or pick another mode.');
  window._starting=true;toast('🧭 Planning route…');
  let path=null;if(mode==='drive'){path=await osrm(S.pos,dest);if(!path)toast('Road routing unavailable — using a straight line for now.');}
  if(!path)path=gcPath(S.pos,dest);
  path[0]=[S.pos.lat,S.pos.lng];path[path.length-1]=[dest.lat,dest.lng];
  const cum=cumul(path),total=cum[cum.length-1],cost=Math.round(total*M.cost);
  window._starting=false;
  if(cost>S.money)return toast('⛔ Need ₽'+cost.toLocaleString());
  S.money-=cost;
  const hours=total/M.kmh,nEnc=M.manual?clamp(Math.round(total/25),0,6):clamp(Math.round(total/350),0,8);
  J={mode,path,cum,total,hours,realSec:clamp(hours*.9,8,70),prog:0,km:0,speed:1,T0:S.time,enc:Array.from({length:nEnc},()=>total*(.08+Math.random()*.84)).sort((a,b)=>a-b),wKm:0,follow:performance.now()+1000};
  setRoute(path);meEl.textContent=M.i;
  const b=new maplibregl.LngLatBounds();path.forEach(p=>b.extend([p[1],p[0]]));
  map.fitBounds(b,{padding:80,maxZoom:15,duration:900});
  tab='go';dirty=true;
}
function stepJourney(dt){
  if(modalOpen)return;
  const M=MODES[J.mode];
  if(M.manual&&S.m.energy<=6){toast('😮‍💨 Too exhausted to continue! Rest (sleep, camp) and set off again.');endJourney(false);return;}
  const np=Math.min(1,J.prog+dt/J.realSec*J.speed),dH=(np-J.prog)*J.hours;
  J.prog=np;S.time+=dH*3600e3;decay(dH*60,J.mode);
  const km=np*J.total;S.pos=posAt(J,km);
  S.stats.kmMode[J.mode]=(S.stats.kmMode[J.mode]||0)+(km-J.km);J.km=km;
  autoCare();
  while(J.enc.length&&km>=J.enc[0]){J.enc.shift();encounter();}
  if(km-J.wKm>600){J.wKm=km;refreshWeather();}
  meMk.setLngLat([S.pos.lng,S.pos.lat]);
  if(performance.now()>J.follow)map.jumpTo({center:[S.pos.lng,S.pos.lat]});
  checkDisc();chk();
  if(np>=1)endJourney(true);
}
function encounter(){
  const s=season(),r=region(S.pos),pool=ENC.filter(e=>(!e.m||e.m.includes(J.mode))&&(!e.r||e.r===r)&&(!e.s||e.s===s));
  const e=rnd(pool);if(!e)return;
  let fx=e.fx;if(e.cost){if(S.money>=e.cost)S.money-=e.cost;else fx={mood:1};}
  applyFx(fx);S.xp+=5;toast('🎞 '+e.t);
}
function endJourney(arrived){
  const wasDest=arrived;
  if(arrived){S.pos={lat:dest.lat,lng:dest.lng};}
  J=null;meEl.textContent='🧍';meMk.setLngLat([S.pos.lng,S.pos.lat]);
  setRoute([]);if(arrived){dMk.remove();dest=null;}
  map.flyTo({center:[S.pos.lng,S.pos.lat],zoom:15,duration:1500});
  refreshWeather();checkDisc();chk();save();
  if(wasDest)toast('🏁 You have arrived. Zoom shows what\'s around you — check the "Do" tab.');
  tab='do';dirty=true;
}

const fx=$('#fx'),fg=fx.getContext('2d');let FW=0,FH=0,PT=[],CL=[],flash=0;

function drawFx(now,dt){
  const day=daylight(localHour(),dayLen()),se=season();
  fg.clearRect(0,0,FW,FH);
  fg.fillStyle='rgba(8,14,45,'+(.5*(1-day)).toFixed(3)+')';fg.fillRect(0,0,FW,FH);
  fg.fillStyle={autumn:'rgba(190,100,10,.07)',winter:'rgba(200,225,255,.08)',spring:'rgba(120,210,120,.04)',summer:'rgba(255,230,120,.04)'}[se];fg.fillRect(0,0,FW,FH);
  const wet=WX.kind==='rain'||WX.kind==='snow'||WX.kind==='storm';
  const n=clamp(Math.round(WX.cloud/100*CL.length)+(wet?2:0),0,CL.length);
  for(let i=0;i<n;i++){const c=CL[i];c.x+=c.v*dt*(1+WX.wind/20);if(c.x>FW+c.w)c.x=-c.w;
    fg.fillStyle='rgba(235,240,250,'+(.1+WX.cloud/100*.12)*(.4+day*.6)+')';
    for(let k=0;k<4;k++){fg.beginPath();fg.ellipse(c.x+k*c.w*.22,c.y+(k%2)*8,c.w*.3,c.w*.12,0,0,7);fg.fill();}}
  if(WX.kind==='rain'||WX.kind==='storm'){fg.strokeStyle='rgba(170,200,255,.5)';fg.lineWidth=1;fg.beginPath();
    for(let i=0;i<220;i++){const p=PT[i];p.y+=p.v*900*dt;p.x-=p.v*120*dt;if(p.y>FH){p.y=-10;p.x=Math.random()*FW;}if(p.x<0)p.x=FW;fg.moveTo(p.x,p.y);fg.lineTo(p.x+2,p.y-12);}fg.stroke();}
  else if(WX.kind==='snow'){fg.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<150;i++){const p=PT[i];p.y+=p.v*60*dt;p.x+=Math.sin(now/800+p.s)*20*dt;if(p.y>FH){p.y=-5;p.x=Math.random()*FW;}fg.beginPath();fg.arc(p.x,p.y,1.4+p.s*.25,0,7);fg.fill();}}
  else if(WX.kind==='fog'){fg.fillStyle='rgba(220,226,235,.28)';fg.fillRect(0,0,FW,FH);}
  if(se==='autumn'&&!wet){fg.fillStyle='rgba(230,140,30,.8)';for(let i=0;i<30;i++){const p=PT[i];p.y+=p.v*35*dt;p.x+=Math.sin(now/600+p.s)*30*dt;if(p.y>FH){p.y=-5;p.x=Math.random()*FW;}fg.fillRect(p.x,p.y,4,3);}}
  if(WX.kind==='storm'&&Math.random()<.004)flash=1;

}

  if(anim==='look')lg.fillText('🔭',x+2,gy-48);
  if(anim==='talk'){lg.fillText('💬',x+16,gy-52);}
  if(anim==='fish'){lg.strokeStyle='#c9b27a';lg.lineWidth=2;lg.beginPath();lg.moveTo(x+14,gy-34);lg.lineTo(x+62,gy-62);lg.stroke();lg.strokeStyle='#fff';lg.lineWidth=1;lg.beginPath();lg.moveTo(x+62,gy-62);lg.lineTo(x+62,gy+6+Math.sin(t/300)*2);lg.stroke();lg.fillStyle='#e11';lg.beginPath();lg.arc(x+62,gy+6+Math.sin(t/300)*2,2.5,0,7);lg.fill();}
}
function drawLife(t){
  const W=360,H=170,type=sceneType(),se=season(),h=localHour(),dl=dayLen(),day=daylight(h,dl);
  const anim=act?act.anim:J?(J.mode==='run'?'run':J.mode==='walk'?'walk':'idle'):'idle';
  const scroll=J?t*.06*{walk:1,run:2.2,bike:2,drive:5,train:4,boat:2.5}[J.mode]:(act&&(act.anim==='walk'||act.anim==='run'||act.anim==='walkpet'))?t*.05*(act.anim==='run'?2.2:1):0;
  const sky=lg.createLinearGradient(0,0,0,H*.7);sky.addColorStop(0,rgb(mixc([6,10,36],[88,160,235],day)));sky.addColorStop(1,rgb(mixc([18,26,60],[190,222,250],day)));
  lg.fillStyle=sky;lg.fillRect(0,0,W,H);
  if(day<.5){lg.fillStyle='rgba(255,255,255,'+((.5-day)*1.6)+')';for(const s of STARS)lg.fillRect(s[0],s[1],1.5,1.5);}
  const sr=12-dl/2,ss=12+dl/2;
  if(h>sr&&h<ss){const a=(h-sr)/(ss-sr);lg.fillStyle='#ffd34d';lg.beginPath();lg.arc(30+300*a,100-Math.sin(a*Math.PI)*70,11,0,7);lg.fill();}
  else{const nf=h>ss?(h-ss)/(24-dl):(h+24-ss)/(24-dl);lg.fillStyle='#e6ecf5';lg.beginPath();lg.arc(30+300*nf,100-Math.sin(nf*Math.PI)*60,8,0,7);lg.fill();}
  const gc={summer:[70,140,60],autumn:[150,110,45],winter:[225,232,240],spring:[110,170,80]}[se],gcol=rgb(mixc(gc.map(v=>v*.35),gc,.35+day*.65));
  const gy=type==='lake'?112:128;
  if(type==='room'){
    lg.fillStyle=rgb(mixc([40,34,52],[217,201,168],.3+day*.7));lg.fillRect(0,0,W,H);
    lg.fillStyle=sky;lg.fillRect(250,22,70,56);lg.strokeStyle='#5b4636';lg.lineWidth=4;lg.strokeRect(250,22,70,56);lg.beginPath();lg.moveTo(285,22);lg.lineTo(285,78);lg.stroke();
    lg.fillStyle='#5b4636';lg.fillRect(0,128,W,H-128);
    if(day<.5){lg.fillStyle='rgba(255,210,120,.25)';lg.beginPath();lg.arc(100,40,50,0,7);lg.fill();}
    if(!act||(act.anim!=='sleep'))drawAvatar(180,128,anim==='idle'?'idle':anim,t);else drawAvatar(180,128,'sleep',t);
  }else{
    lg.fillStyle=gcol;lg.beginPath();lg.moveTo(0,H);lg.lineTo(0,gy-22);
    for(let x=0;x<=W;x+=20)lg.lineTo(x,gy-22+Math.sin(x/55+scroll/80)*10);lg.lineTo(W,H);lg.fill();
    if(type==='lake'){const ice=WX.temp<-5;lg.fillStyle=ice?rgb(mixc([60,70,90],[210,230,245],day)):rgb(mixc([10,30,60],[40,110,170],day));lg.fillRect(0,gy-8,W,H-gy+8);
      lg.strokeStyle='rgba(255,255,255,.35)';lg.lineWidth=1;for(let r=0;r<5;r++){lg.beginPath();for(let x=0;x<=W;x+=6){const y=gy+r*10+Math.sin(x/14+t/400+r)*2;x?lg.lineTo(x,y):lg.moveTo(x,y);}lg.stroke();}
      lg.fillStyle='#8b5e3c';lg.fillRect(120,gy-10,110,6);}
    else{lg.fillStyle=gcol;lg.fillRect(0,gy,W,H-gy);}
    if(type==='forest'||type==='field'||type==='town'||type==='lake'){const off=scroll%90,k0=Math.floor(scroll/90);
      if(type!=='lake'||true)for(let i=-1;i<5;i++){const tx=i*90-off+20+((i+k0)%3)*12;if(type==='town')continue;if(type==='field'&&(i+k0)%2)continue;drawTree(tx,gy-6+((i+k0)%2)*4,type==='forest'?1.2:.9,((i+k0)%4+4)%4,t,se);}}
    if(type==='town'){const off=scroll%150;for(let i=-1;i<4;i++){const hx=i*150-off+10;lg.fillStyle='#b8744a';lg.fillRect(hx,gy-48,70,48);lg.fillStyle='#7a3b2a';lg.beginPath();lg.moveTo(hx-5,gy-48);lg.lineTo(hx+35,gy-70);lg.lineTo(hx+75,gy-48);lg.fill();lg.fillStyle=day<.5?'#ffd479':'#bfe3ff';lg.fillRect(hx+12,gy-36,14,14);lg.fillRect(hx+44,gy-36,14,14);}
      lg.font='20px serif';lg.fillText('🚶',((t/40)%420)-30,gy+16);lg.fillText('🚗',W-((t/25)%500),gy+34);}
    if(type==='forest'&&!J){const wx=((t/50)%520)-80;lg.font='20px serif';lg.fillText(day<.4?'🦉':(S.species.length%2?'🦌':'🐿️'),wx,gy+8);}
    if(type==='field'&&!J){lg.font='14px serif';lg.fillText('🐦',((t/30)%440)-40,40+Math.sin(t/300)*6);if(se==='summer')lg.fillText('🦋',(t/45)%380-20,90+Math.sin(t/200)*10);}
    if(J&&J.mode==='train'){lg.strokeStyle='#555';lg.lineWidth=3;lg.beginPath();lg.moveTo(0,gy+24);lg.lineTo(W,gy+24);lg.stroke();lg.lineWidth=2;for(let x=-(scroll%14);x<W;x+=14){lg.beginPath();lg.moveTo(x,gy+22);lg.lineTo(x,gy+30);lg.stroke();}}
    if(J&&J.mode==='drive'){lg.fillStyle='#3a3a3a';lg.fillRect(0,gy+10,W,26);lg.strokeStyle='#ddd';lg.setLineDash([12,10]);lg.lineDashOffset=scroll;lg.beginPath();lg.moveTo(0,gy+23);lg.lineTo(W,gy+23);lg.stroke();lg.setLineDash([]);}
    if(J&&['train','drive','boat'].includes(J.mode)){lg.font='44px serif';lg.fillText(MODES[J.mode].i,150,gy+(J.mode==='train'?26:J.mode==='drive'?34:22)+Math.sin(t/200)*(J.mode==='boat'?3:.7));}
    else if(J&&J.mode==='bike'){lg.font='40px serif';lg.fillText('🚴',160,gy+14);}
    else{const ax=type==='lake'&&anim!=='swim'?170:180,ay=type==='lake'?(anim==='swim'?gy+12:gy-10):gy;drawAvatar(ax,ay,anim,t);
      if(S.pet&&!J&&anim!=='private'&&anim!=='change'&&anim!=='sleep'&&anim!=='swim'){lg.font='20px serif';lg.fillText(S.pet.type==='dog'?'🐕':'🐈',ax-44-(anim==='walkpet'?Math.sin(t/200)*6:0),ay+2-Math.abs(Math.sin(t/(anim==='play'?120:300)))*(anim==='play'?10:2));}}
  }
  if(WX.kind==='rain'||WX.kind==='storm'){lg.strokeStyle='rgba(170,200,255,.6)';lg.beginPath();for(let i=0;i<40;i++){const x=(i*37+t*.3)%W,y=(i*91+t*.9)%H;lg.moveTo(x,y);lg.lineTo(x-2,y+9);}lg.stroke();}
  else if(WX.kind==='snow'){lg.fillStyle='#fff';for(let i=0;i<40;i++){lg.beginPath();lg.arc((i*37+Math.sin(t/700+i)*10+W)%W,(i*91+t*.05*(1+i%3))%H,1.5,0,7);lg.fill();}}
  lg.fillStyle='rgba(8,14,45,'+(.35*(1-day)).toFixed(3)+')';lg.fillRect(0,0,W,H);
}

/* ============ main loop ============ */
let last=performance.now(),saveT=0,hudT=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(J)stepJourney(dt);
  else if(act){const p=clamp((now-act.t0)/act.dur,0,1);S.time=act.T0+act.min*60e3*p;if(p>=1)finishAct();}
  else if(!modalOpen&&S.intro){const mins=dt*.5;S.time+=mins*60e3;decay(mins,null);}
  drawFx(now,dt);drawLife(now);
  hudT+=dt;if(hudT>.25){hudT=0;updateHud();}
  saveT+=dt;if(saveT>6){saveT=0;if(S.intro)save();}
  if(dirty)renderPanel();
  requestAnimationFrame(loop);
}

/* ============ public handlers ============ */
window.G={
 tab:k=>{tab=k;dirty=true;},
 min:()=>$('#panel').classList.toggle('min'),
 do:i=>{const a=CUR[i];if(!a)return;if(a.fn)a.fn();else perform(a.p);},
 mode:k=>{travelMode=k;dirty=true;},
 preset:v=>{v=+v;if(v<0){presetIdx=-1;return;}const p=PRESETS[v];setDest({lat:p[1],lng:p[2]},v);map.flyTo({center:[p[2],p[1]],zoom:6,duration:1200});},
 go:()=>startJourney(),
 stop:()=>{if(J)endJourney(false);},
 speed:x=>{if(J){J.speed=x;dirty=true;}},
 disc:id=>openDisc(id,false),
 fly:id=>{const D=DISC.find(d=>d.id===id);map.flyTo({center:[D.pts[0][1],D.pts[0][0]],zoom:7,duration:1500});},
 scan:()=>{map.flyTo({center:[S.pos.lng,S.pos.lat],zoom:15.3,duration:1200});setTimeout(detectContext,1500);},
 here:()=>map.flyTo({center:[S.pos.lng,S.pos.lat],zoom:Math.max(map.getZoom(),12),duration:900}),
 world:()=>map.flyTo({center:[95,62],zoom:2.4,duration:1800}),
 wear:n=>{closeModal();perform({label:'Changing clothes',anim:'change',min:10,fx:{mood:3},stat:'changes',after:()=>{S.outfit=n;}});},
 close:()=>closeModal(),
 reset:()=>{if(confirm('Delete your save and start again?')){localStorage.removeItem(SAVE);location.reload();}},
 start:()=>{S.intro=1;closeModal();map.flyTo({center:[S.pos.lng,S.pos.lat],zoom:15,duration:1500});refreshWeather();}
};

/* ============ boot ============ */
synthWeather();updateHud();renderPanel();requestAnimationFrame(loop);
if(!S.intro){
  showModal(`<div class="unl">WELCOME</div><h2>RUSSIA: LIFE & BEYOND</h2><div class="reg">THE LIVING ATLAS</div>
  <p>Live a daily life across the real map of Russia, from a flat near Gorky Park in Moscow to the shores of Lake Baikal and beyond.</p>
  <h4>How to play</h4>
  <div>🎯 <b>Tap the map</b> (or use the 🧭 tab) to pick a destination, choose walk / run / bike / drive / train / boat and go.<br>
  🌍 Landmarks unlock as you pass them, with history, nature and live Wikipedia facts.<br>
  🎮 The <b>Do</b> tab shows what you can do where you stand: swim, hike, sleep, shop, adopt a pet, change clothes…<br>
  📊 Keep your meters up: energy, hunger, thirst, hygiene, mood, bladder (and pet care).<br>
  🌦 Weather is real (Open-Meteo); day, night and seasons follow your location.<br>
  💡 First goal: walk to the Kremlin (about 2.5 km north-east).</div>
  <button class="btn" onclick="G.start()">Start playing ▶</button>`);
}
})();
</script>
