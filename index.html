<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Russia: Life & Beyond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="where" class="sheet">
    <div class="kicker" id="hRegion"></div>
    <h1 id="hCity"></h1>
    <div class="sub" id="hScene"></div>
    <div class="line"><span id="hTime"></span><span id="hWx"></span></div>
    <div id="status"></div>
  </div>
  <div id="topright">
    <div id="money" class="sheet"></div>
    <button class="btn" data-ui="map">Map</button>
    <button class="btn" data-ui="journal">Journal</button>
    <button class="btn" data-ui="bag">Bag</button>
    <button class="btn" data-ui="menu">Menu</button>
  </div>
  <div id="needs" class="sheet"></div>
  <div id="log"></div>
  <div id="prompt" class="sheet hidden"></div>
</div>

<div id="touch" class="hidden">
  <div id="stick"><i></i></div>
  <div id="tbtns">
    <button class="btn" id="tRun">Run</button>
    <button class="btn primary" id="tUse">Use</button>
  </div>
</div>

<div id="jui" class="sheet hidden">
  <div class="kicker" id="jKick">Journey</div>
  <div class="route" id="jRoute"></div>
  <div class="sub" id="jLeg"></div>
  <div id="jbar"><i></i></div>
  <div class="sub" id="jMeta"></div>
  <div id="jlog"></div>
  <div class="actions" id="jAct"></div>
</div>

<div id="title" class="hidden"><div class="card sheet" id="tcard"></div></div>

<div id="mapwrap" class="hidden">
  <div id="mapc"></div>
  <div id="mapside" class="sheet"></div>
  <div id="mapbadge" class="sheet"></div>
</div>

<div id="modal" class="hidden"><div class="sheet" id="mbox"></div></div>
<div id="veil"><span id="veilText"></span></div>
<noscript>This game needs JavaScript.</noscript>

<!-- Load order matters. Each file is one module of the game. -->
<script src="js/data.js"></script>     <!-- shared helpers + all game data -->
<script src="js/art.js"></script>      <!-- drawing: tiles, buildings, people, pets, wildlife -->
<script src="js/scenes.js"></script>   <!-- playable places across Russia -->
<script src="js/engine.js"></script>   <!-- world simulation, needs, activities, rendering -->
<script src="js/travel.js"></script>   <!-- journeys and the world map -->
<script src="js/ui.js"></script>       <!-- HUD, menus, input, start-up -->
</body>
</html>
